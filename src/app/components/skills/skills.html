<section id="skills" class="relative">
  <div class="max-w-6xl mx-auto px-6 py-20">
    <div appReveal class="text-center mb-12">
      <p class="font-mono text-sm text-ink-400"><span class="text-accent">$</span> skills.stack</p>
      <h2 class="mt-2 text-3xl md:text-4xl font-extrabold tracking-tight">Technical Skills</h2>
    </div>

    <!-- specializations -->
    <div appReveal class="mb-10 rounded-2xl border border-accent/30 bg-accent/5 dark:bg-accent/10 p-6">
      <p class="font-mono text-xs text-ink-400 mb-3"><span class="text-accent">$</span> specializations</p>
      <div class="flex flex-wrap gap-2">
        @for (item of specializations; track item) {
          <span class="text-sm px-3 py-1.5 rounded-md bg-white dark:bg-ink-900 border border-ink-200 dark:border-ink-700 text-ink-700 dark:text-ink-200">
            {{ item }}
          </span>
        }
      </div>
    </div>

    <!-- skill matrix -->
    <div appReveal revealStagger=".skill-card" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
      @for (group of groups; track group.category) {
        <div class="skill-card rounded-xl border border-ink-200 dark:border-ink-800 bg-white dark:bg-ink-900/40 p-5 shadow-card">
          <div class="flex items-center gap-2 mb-3">
            <span class="h-2 w-2 rounded-full bg-accent"></span>
            <h3 class="font-mono text-sm text-ink-700 dark:text-ink-200">{{ group.category }}</h3>
          </div>
          <div class="flex flex-wrap gap-2">
            @for (item of group.items; track item) {
              <span class="text-xs px-2.5 py-1 rounded-md bg-ink-100 dark:bg-ink-800/70 text-ink-700 dark:text-ink-200 border border-ink-200 dark:border-ink-700">
                {{ item }}
              </span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
