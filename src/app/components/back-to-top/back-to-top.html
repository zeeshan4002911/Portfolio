<button
  #btn
  type="button"
  (click)="scrollToTop()"
  aria-label="Back to top"
  title="Back to top"
  [attr.aria-hidden]="!visible()"
  [attr.tabindex]="visible() ? 0 : -1"
  [class.pointer-events-none]="!visible()"
  class="back-to-top fixed bottom-6 right-6 z-50 h-12 w-12 rounded-full bg-accent text-white shadow-glow flex items-center justify-center hover:scale-110 transition-transform duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-accent focus-visible:ring-offset-ink-50 dark:focus-visible:ring-offset-ink-950"
>
  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m18 15-6-6-6 6"/>
  </svg>
</button>
